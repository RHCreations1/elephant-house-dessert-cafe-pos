name: Deploy Elephant House POS to Firebase

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Preserve deployment workflow
        run: cp .github/workflows/deploy-firebase.yml /tmp/deploy-firebase.yml

      - name: Restore complete POS source archive
        run: |
          cat \
            .source/package-part-0.b64 \
            .source/package-part-1a.b64 \
            .source/package-part-1b.b64 \
            .source/package-part-3.b64 \
            .source/package-part-4.b64 \
            .source/package-part-5a.b64 \
            .source/package-part-5b.b64 \
            .source/package-part-5c.b64 \
            .source/package-part-5d.b64 \
            .source/package-part-5e.b64 \
            .source/package-part-5f.b64 \
            .source/package-part-5g.b64 \
            | base64 --decode > /tmp/elephant-house-pos-source.zip
          unzip -oq /tmp/elephant-house-pos-source.zip -d .
          # Apply production fixes to the restored client source before committing it.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("possrc/app.js")
          s = p.read_text()
          s = s.replace('firebase.functions("asia-south1")', 'firebase.app().functions("asia-south1")')
          old = 'const auth=firebase.auth();\n      if(!auth.currentUser) await auth.signInAnonymously();'
          new = '''const auth=firebase.auth();
      // A privileged token must not silently survive a page reload while the UI resets to Cashier.
      if(auth.currentUser) {
        const existingToken = await auth.currentUser.getIdTokenResult();
        if(existingToken.claims.role === "admin" || existingToken.claims.role === "supervisor") {
          await auth.signOut();
        }
      }
      if(!auth.currentUser) await auth.signInAnonymously();'''
          if old not in s:
            raise SystemExit("Could not find the Firebase auth initialization block; refusing to continue.")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -rf .source
          mkdir -p .github/workflows
          cp /tmp/deploy-firebase.yml .github/workflows/deploy-firebase.yml

      - name: Commit restored POS source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete Elephant House POS source"
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELEPHANT_HOUSE_POS }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions

      - name: Deploy Firestore rules, Cloud Functions and Hosting
        run: firebase deploy --project elephant-house-pos --only firestore:rules,functions,hosting
